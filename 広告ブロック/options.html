<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>広告ブロッカー - 除外サイト管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #16213e, #0f3460);
      padding: 24px 40px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-icon {
      width: 36px;
      height: 36px;
      background: #27ae60;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }
    .header-text h1 { font-size: 18px; font-weight: 600; }
    .header-text p { font-size: 12px; color: #7f8c8d; margin-top: 2px; }

    .container {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: #16213e;
      border-radius: 16px;
      border: 1px solid #0f3460;
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-header h2 { font-size: 13px; font-weight: 600; color: #bdc3c7; }
    .card-body { padding: 20px; }

    /* 追加フォーム */
    .add-form { display: flex; gap: 10px; }
    .add-form input {
      flex: 1;
      background: #0f1a2e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 10px 14px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-form input:focus { border-color: #3498db; }
    .add-form input::placeholder { color: #4a4a6a; }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .btn-primary {
      background: #2980b9;
      color: white;
    }
    .btn-primary:hover { background: #3498db; }
    .btn-primary:disabled { background: #2c3e50; color: #4a4a6a; cursor: not-allowed; }
    .btn-danger {
      background: rgba(231,76,60,0.15);
      color: #e74c3c;
      border: 1px solid rgba(231,76,60,0.3);
      font-size: 12px;
      padding: 6px 12px;
    }
    .btn-danger:hover { background: rgba(231,76,60,0.3); }

    .toast {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }
    .toast.success { background: rgba(39,174,96,0.15); color: #27ae60; border: 1px solid rgba(39,174,96,0.3); }
    .toast.error   { background: rgba(231,76,60,0.15); color: #e74c3c; border: 1px solid rgba(231,76,60,0.3); }

    /* 除外リスト */
    .list-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #0f3460;
      color: #3498db;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .search-box {
      flex: 1;
      background: #0f1a2e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 6px 12px;
      color: #e0e0e0;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: #3498db; }
    .search-box::placeholder { color: #4a4a6a; }

    .exclusion-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .exclusion-table th {
      text-align: left;
      font-size: 11px;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 0 10px;
      border-bottom: 1px solid #0f3460;
    }
    .exclusion-table th:last-child { text-align: right; }
    .exclusion-table td {
      padding: 10px 0;
      border-bottom: 1px solid rgba(15,52,96,0.5);
      vertical-align: middle;
    }
    .exclusion-table tr:last-child td { border-bottom: none; }
    .domain-cell { color: #bdc3c7; font-family: monospace; font-size: 13px; }
    .action-cell { text-align: right; }

    .remove-btn {
      background: none;
      border: none;
      color: #e74c3c;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0.6;
      transition: 0.15s;
    }
    .remove-btn:hover { opacity: 1; background: rgba(231,76,60,0.15); }

    .empty-state {
      text-align: center;
      padding: 32px 0;
      color: #4a4a6a;
      font-size: 13px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">B</div>
    <div class="header-text">
      <h1>広告ブロッカー</h1>
      <p>除外サイト管理</p>
    </div>
  </div>

  <div class="container">

    <!-- 追加フォーム -->
    <div class="card">
      <div class="card-header">
        <h2>サイトを手動で追加</h2>
      </div>
      <div class="card-body">
        <div class="add-form">
          <input
            type="text"
            id="domain-input"
            placeholder="例: youtube.com, example.co.jp"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="btn btn-primary" id="add-btn">追加</button>
        </div>
        <div class="toast" id="toast"></div>
      </div>
    </div>

    <!-- 除外リスト -->
    <div class="card">
      <div class="card-header">
        <h2>除外サイト一覧 <span class="badge" id="count-badge">0</span></h2>
        <div class="list-controls">
          <input class="search-box" type="text" id="search-input" placeholder="絞り込み..." autocomplete="off">
          <button class="btn btn-danger" id="clear-all-btn">すべて削除</button>
        </div>
      </div>
      <div class="card-body">
        <table class="exclusion-table" id="exclusion-table">
          <thead>
            <tr>
              <th>ドメイン</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="exclusion-tbody"></tbody>
        </table>
        <div class="empty-state hidden" id="empty-state">除外サイトはまだありません</div>
      </div>
    </div>

  </div>

  <script src="options.js"></script>
</body>
</html>
