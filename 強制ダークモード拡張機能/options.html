<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>強制ダークモード - 設定</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      min-height: 100vh;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: #6c7086;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 13px;
      font-weight: 600;
      color: #a6adc8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .card {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .site-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      gap: 12px;
      border-bottom: 1px solid #313244;
    }

    .site-row:last-child {
      border-bottom: none;
    }

    .site-name {
      font-size: 13px;
      word-break: break-all;
    }

    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .badge-excluded {
      background: #313244;
      color: #6c7086;
    }

    .badge-forced {
      background: #1a3a5c;
      color: #89b4fa;
    }

    .remove-btn {
      flex-shrink: 0;
      padding: 4px 10px;
      font-size: 11px;
      color: #f38ba8;
      background: none;
      border: 1px solid #f38ba830;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .remove-btn:hover {
      background: #f38ba815;
    }

    .empty {
      padding: 24px 16px;
      font-size: 13px;
      color: #45475a;
      text-align: center;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }

    .clear-btn {
      padding: 7px 14px;
      font-size: 12px;
      color: #f38ba8;
      background: none;
      border: 1px solid #f38ba830;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .clear-btn:hover {
      background: #f38ba815;
    }

    .clear-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .add-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      background: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      color: #cdd6f4;
      outline: none;
    }

    .add-input::placeholder {
      color: #45475a;
    }

    .add-input:focus {
      border-color: #585b70;
    }

    .add-btn {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #cdd6f4;
      background: #313244;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .add-btn:hover {
      background: #45475a;
    }

    .error {
      font-size: 11px;
      color: #f38ba8;
      margin-top: -16px;
      margin-bottom: 16px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌙 強制ダークモード 設定</h1>
    <p class="subtitle">サイトごとのダークモード設定を管理します</p>

    <h2>サイトを追加で除外</h2>
    <div class="add-form">
      <input class="add-input" id="add-input" type="text" placeholder="example.com">
      <button class="add-btn" id="add-btn">除外に追加</button>
    </div>
    <p class="error" id="add-error"></p>

    <h2>個別設定一覧</h2>
    <div class="actions">
      <button class="clear-btn" id="clear-btn">すべてリセット</button>
    </div>
    <div class="card" id="list"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
