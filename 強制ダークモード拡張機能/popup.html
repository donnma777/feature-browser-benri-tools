<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
    }

    header {
      padding: 16px;
      border-bottom: 1px solid #313244;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .section {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section + .section {
      border-top: 1px solid #313244;
    }

    .label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .label-main {
      font-size: 13px;
      font-weight: 500;
    }

    .label-sub {
      font-size: 11px;
      color: #6c7086;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #313244;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #cdd6f4;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    input:checked + .slider {
      background: #1a73e8;
    }

    input:checked + .slider::before {
      transform: translateX(20px);
    }

    footer {
      padding: 10px 16px;
      font-size: 10px;
      color: #45475a;
      border-top: 1px solid #313244;
      text-align: center;
    }

    .options-link {
      display: block;
      width: 100%;
      padding: 10px 16px;
      font-size: 12px;
      color: #6c7086;
      background: none;
      border: none;
      border-top: 1px solid #313244;
      text-align: left;
      cursor: pointer;
      transition: color 0.15s;
    }

    .options-link:hover {
      color: #cdd6f4;
    }

    .scheme-section {
      padding: 14px 16px;
      border-top: 1px solid #313244;
    }

    .scheme-title {
      font-size: 11px;
      color: #6c7086;
      margin-bottom: 8px;
    }

    .segmented {
      display: flex;
      background: #181825;
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }

    .segmented button {
      flex: 1;
      padding: 7px 0;
      border: none;
      border-radius: 6px;
      background: none;
      color: #6c7086;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .segmented button.active {
      background: #1a73e8;
      color: #fff;
    }

    .segmented button:hover:not(.active) {
      color: #cdd6f4;
    }

    .scheme-note {
      font-size: 10px;
      color: #45475a;
      margin-top: 8px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>🌙 強制ダークモード</header>

  <div class="section">
    <div class="label">
      <span class="label-main">このサイト</span>
      <span class="label-sub" id="hostname-label">-</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="site-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section">
    <div class="label">
      <span class="label-main">すべてのサイト</span>
      <span class="label-sub">グローバル設定</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="global-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="scheme-section">
    <div class="scheme-title">表示モードのシミュレート（このタブのみ）</div>
    <div class="segmented">
      <button data-scheme="auto" id="scheme-auto">OFF</button>
      <button data-scheme="light" id="scheme-light">ライト</button>
      <button data-scheme="dark" id="scheme-dark">ダーク</button>
    </div>
    <div class="scheme-note">
      OSやブラウザの設定に関わらず、prefers-color-scheme を偽装してこのタブだけ確認できます。デバッグ中を示す黄色いバーが表示されます。タブを閉じる/離れると自動解除されます。
    </div>
  </div>

  <button class="options-link" id="open-options">⚙ 除外リストを管理</button>
  <footer>サイト個別設定はグローバル設定より優先されます</footer>

  <script src="popup.js"></script>
</body>
</html>
